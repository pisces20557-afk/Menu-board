<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>브릿지 커피 메뉴판</title>

<!--
  ╔══════════════════════════════════════════════════════════════╗
  ║  메뉴 정보 (메뉴를 고치거나 추가할 때는 이 칸만 보세요!)      ║
  ╚══════════════════════════════════════════════════════════════╝

  ■ 이 칸의 규칙 (꼭 지켜주세요. 하나라도 빠지면 메뉴판이 안 보일 수 있어요)
    1) 메뉴 한 개는 중괄호 { } 한 덩어리입니다.
    2) 글자(이름, 설명, 종류)는 반드시 큰따옴표 " " 로 감쌉니다.
    3) 가격은 숫자만 씁니다. 따옴표도, 쉼표(,)도, "원" 글자도 쓰지 않습니다.
         좋은 예:  가격: 4500
         나쁜 예:  가격: "4,500원"   /   가격: 4,500
       (화면에는 자동으로 "4,500원"으로 예쁘게 바뀌어 나옵니다)
    4) 메뉴 한 덩어리가 끝나면 } 뒤에 쉼표(,)를 붙입니다.
       단, 맨 마지막 메뉴 뒤에는 쉼표를 붙이지 않아도 됩니다.
    5) 쓸 때는 영어 따옴표(" ")를 쓰세요. 휴대폰 키보드가 자동으로 만든
       굽은 따옴표(“ ”)를 쓰면 작동하지 않습니다.

  ■ 메뉴 한 개의 모양 (복사해서 쓰세요)
       { 이름: "메뉴 이름", 가격: 5000, 설명: "한 줄 설명", 종류: "커피" },

  ■ 하고 싶은 일별 방법
    [가격 바꾸기]   바꿀 메뉴를 찾아서 가격: 뒤의 숫자만 고칩니다.
                    예) 아메리카노를 4,800원으로 → 가격: 4800
    [설명 바꾸기]   설명: 뒤의 큰따옴표 안 글자만 고칩니다.
    [이름 바꾸기]   이름: 뒤의 큰따옴표 안 글자만 고칩니다.
    [메뉴 추가하기] 같은 종류 메뉴들 맨 아래 줄을 복사해서 바로 밑에 붙여넣고,
                    이름, 가격, 설명을 새 내용으로 고칩니다.
                    (종류는 "커피", "논커피", "디저트" 중 하나여야 합니다)

      ▶ 완전 초보용 따라하기 (예: 커피에 "카푸치노 5,200원"을 추가)
        1단계) 아래쪽 [커피] 줄들 중에서 아무 한 줄을 찾습니다.
               예를 들어 이렇게 생긴 줄입니다.
               { 이름: "카페라떼", 가격: 5000, 설명: "부드러운 우유 거품", 종류: "커피" },
        2단계) 그 줄을 "복사"합니다. 복사하는 범위는 이렇습니다.
               - 시작: 줄 맨 앞의 여는 중괄호 {
               - 끝  : 줄 맨 끝의 쉼표 , (닫는 중괄호 } 바로 뒤의 쉼표까지)
               마우스로 줄의 { 앞에서 클릭한 채 줄 끝 쉼표 뒤까지 끌어서 색을 칠한 뒤
               Ctrl + C 를 누릅니다.
               (줄 맨 앞 빈칸은 복사해도 안 해도 괜찮습니다)
        3단계) 붙여넣을 자리를 정합니다.
               [커피] 마지막 줄(디카페인 아메리카노) 끝의 쉼표 뒤에 마우스를 클릭하고
               키보드의 Enter 를 한 번 눌러 빈 줄을 만듭니다.
               (바로 아래에 "[논커피]" 구분 줄이 보이면 그 위쪽입니다)
        4단계) 새 빈 줄에서 Ctrl + V 를 누르면 방금 복사한 줄이 붙습니다.
        5단계) 붙은 줄에서 따옴표 안의 글자와 숫자만 바꿉니다.
               { 이름: "카푸치노", 가격: 5200, 설명: "진한 에스프레소와 거품", 종류: "커피" },
               따옴표 " 와 쉼표 , 와 중괄호 { } 는 지우지 마세요.
        6단계) Ctrl + S 로 저장하고 브라우저에서 F5 로 새로고침하면 끝입니다.
        ※ 메뉴 순서는 파일에 적힌 순서 그대로 화면에 나옵니다.
          그래서 같은 종류 끝에 붙여넣으면 그 종류의 맨 아래에 나옵니다.
        ※ 메뉴가 안 나오면: 붙여넣은 줄 끝에 쉼표 , 가 있는지,
          따옴표가 짝이 맞는지(여는 것과 닫는 것 둘 다 있는지) 확인하세요.
    [메뉴 지우기]   지울 메뉴의 한 줄 전체를 지웁니다.
                    (지우기 겁나면 줄 맨 앞에 // 를 붙이면 잠깐 숨겨집니다.
                     // 를 다시 지우면 돌아옵니다)
    [대표 메뉴 바꾸기]  화면 위쪽의 큰 파란 카드 2개가 대표 메뉴입니다.
                    대표로 만들 메뉴 줄 끝에  , 대표: true  를 붙이세요.
                    예) { 이름: "...", 가격: 5000, 설명: "...", 종류: "커피", 대표: true },
                    빼려면 그 부분을 지웁니다. 카드가 2개일 때 가장 예쁩니다.
    [새 종류 만들기]  예를 들어 "음료"를 새로 만들려면 두 군데를 고칩니다.
                    (1) 메뉴 줄에서 종류: "음료" 라고 쓰고
                    (2) 바로 아래 종류목록에 "음료"를 추가합니다.
                    두 곳의 글자가 똑같아야 합니다.

  ■ 고친 뒤에는 파일을 저장(Ctrl + S)하고, 브라우저에서 새로고침(F5) 하세요.
    화면이 하얗게 비거나 메뉴가 안 나오면 따옴표나 쉼표가 빠졌는지 확인하세요.
-->
<script>
  const MENU = [

    // ───────── [커피] ─────────
    { 이름: "아메리카노",          가격: 4500, 설명: "산미가 적은 고소한 원두",           종류: "커피" },
    { 이름: "카페라떼",            가격: 5000, 설명: "부드러운 우유 거품",               종류: "커피" },
    { 이름: "바닐라 라떼",         가격: 5500, 설명: "바닐라빈을 직접 우려낸 시럽",       종류: "커피" },
    { 이름: "아인슈페너",          가격: 5800, 설명: "단맛을 줄인 수제 크림",            종류: "커피", 대표: true },
    { 이름: "콜드브루",            가격: 5300, 설명: "12시간 저온 추출, 목넘김이 깔끔함", 종류: "커피" },
    { 이름: "디카페인 아메리카노", 가격: 5000, 설명: "카페인 걱정 없이 편하게",          종류: "커피" },

    // ───────── [논커피] ─────────
    { 이름: "흑임자 라떼",         가격: 5500, 설명: "국산 흑임자를 직접 갈아 넣음",      종류: "논커피", 대표: true },
    { 이름: "말차 라떼",           가격: 5800, 설명: "우지 말차, 쌉쌀한 맛이 진함",       종류: "논커피" },
    { 이름: "쑥 라떼",             가격: 5500, 설명: "강화도 쑥, 은은하고 담백함",        종류: "논커피" },
    { 이름: "곡물 라떼",           가격: 5300, 설명: "볶은 곡물의 구수한 맛",            종류: "논커피" },
    { 이름: "자몽에이드",          가격: 6000, 설명: "생과일 자몽 과육을 그대로",         종류: "논커피" },

    // ───────── [디저트] ─────────
    { 이름: "치즈케이크",          가격: 6500, 설명: "굽지 않은 부드러운 식감",           종류: "디저트" },
    { 이름: "당근케이크",          가격: 6000, 설명: "견과류를 넉넉히 넣음",             종류: "디저트" },
    { 이름: "스콘",                가격: 4000, 설명: "겉은 바삭 속은 촉촉, 잼과 함께",    종류: "디저트" },
    { 이름: "바스크 치즈케이크",   가격: 6800, 설명: "겉면을 진하게 태운 풍미",           종류: "디저트" }

    // ▲ 새 메뉴는 위쪽 같은 종류 줄들 맨 아래에 한 줄 추가하세요.
  ];

  // 화면 위쪽의 종류 버튼 목록입니다. "전체"는 그대로 두세요.
  // 새 종류를 만들면 여기에도 같은 글자로 추가해야 버튼이 생깁니다.
  // 버튼 순서를 바꾸고 싶으면 글자 순서를 바꾸면 됩니다.
  const 종류목록 = ["전체", "커피", "논커피", "디저트"];
</script>

<style>
  /* ===== 색상 ===== 여기 줄을 바꾸면 전체 색이 바뀝니다 */
  :root {
    --blue: #2563EB;        /* 포인트 파랑: 카드, 버튼 */
    --blue-soft: #EFF4FF;   /* 연한 파랑: 메뉴 카드 바탕 */
    --ink: #111827;         /* 글자색 */
    --gray: #6B7280;        /* 설명 글자색 */
    --line: #E5E7EB;        /* 얇은 선 */
    --gap: 12px;            /* 칸 사이 간격 (모든 칸이 같은 간격을 씁니다) */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    /* 글꼴: 고운 돋움 먼저, 없으면 맑은 고딕 */
    font-family: "고운 돋움", "GowunDodum", "Gowun Dodum", "맑은 고딕", "Malgun Gothic", sans-serif;
    background: #fff;
    color: var(--ink);
  }

  .wrap { max-width: 430px; margin: 0 auto; padding: 28px 18px 40px; }

  /* 격자: 모든 칸이 2열로 가지런히 놓입니다 */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
  .grid .full { grid-column: 1 / -1; }

  /* 맨 위 */
  header { padding-bottom: 20px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
  header .tag { font-size: 12px; color: var(--blue); font-weight: bold; letter-spacing: 1px; }
  header h1 { font-size: 32px; margin-top: 6px; }
  header .intro { margin-top: 8px; font-size: 15px; color: var(--gray); }
  header .place { margin-top: 2px; font-size: 13px; color: var(--gray); }

  .label { font-size: 12px; color: var(--gray); font-weight: bold; margin: 0 0 10px 2px; letter-spacing: 1px; }

  /* 대표 메뉴: 파란 카드 */
  .sig { background: var(--blue); color: #fff; border-radius: 16px; padding: 18px 14px; min-height: 120px;
         display: flex; flex-direction: column; justify-content: space-between; }
  .sig .badge { font-size: 11px; background: rgba(255,255,255,0.22); padding: 3px 9px; border-radius: 999px; align-self: flex-start; }
  .sig .name { font-size: 17px; font-weight: bold; margin-top: 18px; }
  .sig .price { font-size: 15px; margin-top: 4px; opacity: 0.9; }

  /* 카테고리 버튼 */
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 26px 0 var(--gap); }
  .tabs button { padding: 11px 0; font-family: inherit; font-size: 14px; cursor: pointer;
                 border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 12px; }
  .tabs button.on { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: bold; }

  /* 메뉴 카드 */
  .item { background: var(--blue-soft); border-radius: 16px; padding: 16px 14px; min-height: 132px;
          display: flex; flex-direction: column; }
  .item .name { font-size: 15px; font-weight: bold; line-height: 1.35; }
  .item .desc { font-size: 12px; color: var(--gray); margin-top: 6px; line-height: 1.5; flex: 1; }
  .item .price { font-size: 15px; color: var(--blue); font-weight: bold; margin-top: 10px; }

  /* 가게 안내 */
  .info { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.9; }
  .info b { display: inline-block; width: 64px; color: var(--gray); font-weight: normal; }
  .call { display: block; margin-top: 18px; text-align: center; text-decoration: none; background: var(--blue);
          color: #fff; font-size: 17px; font-weight: bold; padding: 16px 0; border-radius: 16px; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="tag">MENU</div>
    <h1>브릿지 커피</h1>
    <p class="intro">매일 직접 볶는 스페셜티 커피</p>
    <p class="place">광주 북구 비엔날레</p>
  </header>

  <div class="label">대표 메뉴</div>
  <div class="grid" id="signature"></div>

  <div class="tabs" id="tabs"></div>
  <div class="grid" id="list"></div>

  <!-- 가게 안내: 영업시간, 전화번호 등은 여기 글자를 직접 고치면 됩니다 -->
  <div class="info">
    <div><b>영업시간</b>평일 08:00 - 21:00</div>
    <div><b></b>주말 10:00 - 20:00</div>
    <div><b>휴무</b>매주 목요일</div>
    <div><b>주차</b>2대 가능</div>
    <div><b>자리</b>1인 좌석 6석</div>
    <div><b>인스타</b>@bridge_coffee</div>
    <!-- 전화 걸기 버튼: 번호를 바꾸려면 href의 tel: 뒤 번호를 고치세요. 버튼 글자는 아래 '전화 걸기'를 고치면 됩니다 -->
    <a class="call" href="tel:062-000-0000">전화 걸기 · 062-000-0000</a>
  </div>

</div>

<script>
  // (메뉴 목록은 파일 맨 위 "메뉴 정보" 칸으로 옮겼습니다. 메뉴를 고칠 때는 거기만 보세요.)

  const 원 = n => n.toLocaleString("ko-KR") + "원";

  // 대표 메뉴 그리기
  document.getElementById("signature").innerHTML = MENU.filter(m => m.대표).map(m =>
    `<div class="sig"><span class="badge">대표 메뉴</span>
     <div><div class="name">${m.이름}</div><div class="price">${원(m.가격)}</div></div></div>`
  ).join("");

  // 메뉴 목록 그리기
  const list = document.getElementById("list");
  function 보여주기(종류) {
    list.innerHTML = MENU.filter(m => 종류 === "전체" || m.종류 === 종류).map(m =>
      `<div class="item">
         <div class="name">${m.이름}</div>
         <div class="desc">${m.설명}</div>
         <div class="price">${원(m.가격)}</div>
       </div>`
    ).join("");
    document.querySelectorAll(".tabs button").forEach(b =>
      b.classList.toggle("on", b.textContent === 종류));
  }

  // 카테고리 버튼 만들기
  const tabs = document.getElementById("tabs");
  종류목록.forEach(t => {
    const b = document.createElement("button");
    b.textContent = t;
    b.onclick = () => 보여주기(t);
    tabs.appendChild(b);
  });

  보여주기("전체");
</script>
</body>
</html>
